  .filter-row input[type=checkbox] { accent-color: #6666bb; }
  .color-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0;
  }
  .filter-row label { cursor: pointer; flex: 1; }
  .filter-row .count { color: #666; font-size: 11px; }

  #info-panel {
    margin-top: 16px; padding: 10px; background: #12122a; border-radius: 6px;

  }
  .btn:hover { background: #3a3a6a; color: #ddd; }
  .btn-row { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }

  #search-results {
    margin-top: 6px; font-size: 12px; max-height: 150px; overflow-y: auto;
  }
  .search-result {
    padding: 4px 8px; cursor: pointer; border-radius: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .search-result:hover { background: #2a2a4a; }

  #hops-control { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #hops-control label { font-size: 12px; color: #888; }
  #hops-control select {
    background: #12122a; border: 1px solid #3a3a5a; color: #e0e0e0;
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
</style>

// Build vis datasets
const allNodes = new vis.DataSet(GRAPH_DATA.nodes.map(n => ({
  ...n,
  font: { color: '#ccc', size: 11 },
  borderWidth: 0,
  shape: 'dot',
  hidden: false,
  _origColor: n.color,
  _origSize: n.size,

const allEdges = new vis.DataSet(GRAPH_DATA.edges.map((e, i) => ({
  ...e,
  id: 'e' + i,
  arrows: 'to',
  font: { size: 0, color: '#666' },
  width: e.predicate === 'appears_with' ? 0.5 : 1.5,
  hidden: false,
  _predicate: e.predicate,

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, {
  physics: {
    solver: 'forceAtlas2Based',
    forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 120, springConstant: 0.06 },
    stabilization: { iterations: 200 },

  interaction: { hover: true, tooltipDelay: 150, navigationButtons: true, keyboard: true },
  edges: { smooth: { type: 'continuous' } },
});

// ─── Filter state ───
let activeTypes = new Set(GRAPH_DATA.entity_types);
let activePreds = new Set(GRAPH_DATA.predicates);
let focusedNode = null;
let physicsOn = true;

// ─── Build filter checkboxes ───
function buildFilters() {
  const typeDiv = document.getElementById('type-filters');
  const typeCounts = {};
  GRAPH_DATA.nodes.forEach(n => { typeCounts[n.group] = (typeCounts[n.group] || 0) + 1; });

  GRAPH_DATA.entity_types.forEach(t => {
    const row = document.createElement('div');
    row.className = 'filter-row';
    row.innerHTML = `
      <input type="checkbox" id="type-${t}" checked>
      <span class="color-dot" style="background:${TYPE_COLORS[t] || '#999'}"></span>
      <label for="type-${t}">${t}</label>
      <span class="count">${typeCounts[t] || 0}</span>
    `;
    row.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) activeTypes.add(t); else activeTypes.delete(t);
      applyFilters();
    });
    typeDiv.appendChild(row);
  });

  const predDiv = document.getElementById('pred-filters');
  const predCounts = {};
  GRAPH_DATA.edges.forEach(e => { predCounts[e.predicate] = (predCounts[e.predicate] || 0) + 1; });

  GRAPH_DATA.predicates.forEach(p => {
    const row = document.createElement('div');
    row.className = 'filter-row';
    row.innerHTML = `
      <input type="checkbox" id="pred-${p}" checked>
      <span class="color-dot" style="background:${PRED_COLORS[p] || '#999'}"></span>
      <label for="pred-${p}">${p}</label>
      <span class="count">${predCounts[p] || 0}</span>
    `;
    row.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) activePreds.add(p); else activePreds.delete(p);
      applyFilters();
    });
    predDiv.appendChild(row);
  });
}

function applyFilters() {
  // Update node visibility based on type filters
  const nodeUpdates = [];
  allNodes.forEach(n => {
    const visible = activeTypes.has(n._group);
    if (n.hidden === visible) {  // needs toggle
      nodeUpdates.push({ id: n.id, hidden: !visible });
    }
  });
  if (nodeUpdates.length) allNodes.update(nodeUpdates);

  // Update edge visibility based on predicate filters + endpoint visibility
  const visibleNodes = new Set();
  allNodes.forEach(n => { if (!n.hidden) visibleNodes.add(n.id); });

  const edgeUpdates = [];
  allEdges.forEach(e => {
    const visible = activePreds.has(e._predicate) && visibleNodes.has(e.from) && visibleNodes.has(e.to);
    if (e.hidden === visible) {
      edgeUpdates.push({ id: e.id, hidden: !visible });
    }
  });
  if (edgeUpdates.length) allEdges.update(edgeUpdates);

  updateStats();
}

// ─── Search ───
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (q.length < 2) return;

  const matches = GRAPH_DATA.nodes
    .filter(n => n.label.toLowerCase().includes(q))
    .sort((a, b) => b.relCount - a.relCount)
    .slice(0, 15);

  matches.forEach(m => {
    const div = document.createElement('div');
    div.className = 'search-result';
    div.innerHTML = `
      <span class="color-dot" style="background:${TYPE_COLORS[m.group] || '#999'}"></span>
      <span>${m.label}</span>
      <span class="count">${m.group}</span>
    `;
    div.addEventListener('click', () => focusOnNode(m.id));
    searchResults.appendChild(div);
  });
});

function focusOnNode(nodeId) {
  focusedNode = nodeId;
  searchResults.innerHTML = '';

  const hops = parseInt(document.getElementById('hops-select').value);
  const neighborhood = getNeighborhood(nodeId, hops);

  // Dim everything, highlight neighborhood
  const nodeUpdates = [];
  allNodes.forEach(n => {
    if (neighborhood.nodes.has(n.id)) {
      nodeUpdates.push({
        id: n.id,
        color: n._origColor,
        size: n.id === nodeId ? 30 : n._origSize,
        font: { color: '#fff', size: n.id === nodeId ? 14 : 11 },
        hidden: false,
      });
    } else {
      nodeUpdates.push({
        id: n.id,
        color: '#1a1a2e',
        size: 3,
        font: { color: 'transparent', size: 0 },
        hidden: false,
      });
    }
  });
  allNodes.update(nodeUpdates);

  const edgeUpdates = [];
  allEdges.forEach(e => {
    if (neighborhood.edges.has(e.id)) {
      edgeUpdates.push({ id: e.id, color: e._origColor, width: 2, font: { size: 10, color: '#888' }, hidden: false });
    } else {
      edgeUpdates.push({ id: e.id, color: '#0f0f1a', width: 0, font: { size: 0 }, hidden: true });
    }
  });
  allEdges.update(edgeUpdates);

  network.focus(nodeId, { scale: 1.2, animation: { duration: 500 } });
  showNodeInfo(nodeId);
  updateStats();
}

function getNeighborhood(nodeId, hops) {
  const nodes = new Set([nodeId]);
  const edges = new Set();
  let frontier = new Set([nodeId]);

  for (let h = 0; h < hops; h++) {
    const nextFrontier = new Set();
    allEdges.forEach(e => {
      if (!activePreds.has(e._predicate)) return;
      if (frontier.has(e.from) && !nodes.has(e.to) || frontier.has(e.to) && !nodes.has(e.from)) {
        const neighbor = frontier.has(e.from) ? e.to : e.from;
        // Check type filter
        const neighborNode = allNodes.get(neighbor);
        if (neighborNode && activeTypes.has(neighborNode._group)) {
          nextFrontier.add(neighbor);
          nodes.add(neighbor);
          edges.add(e.id);
        }
      }
      // Also include edges between already-included frontier nodes
      if (frontier.has(e.from) || frontier.has(e.to)) {
        if (nodes.has(e.from) && nodes.has(e.to)) {
          edges.add(e.id);
        }
      }
    });
    frontier = nextFrontier;
  }

  // Add edges between all neighborhood nodes
  allEdges.forEach(e => {
    if (nodes.has(e.from) && nodes.has(e.to) && activePreds.has(e._predicate)) {
      edges.add(e.id);
    }
  });

  return { nodes, edges };
}

// ─── Node info panel ───
function showNodeInfo(nodeId) {
  const node = GRAPH_DATA.nodes.find(n => n.id === nodeId);
  if (!node) return;

  const panel = document.getElementById('info-panel');
  panel.style.display = 'block';

  let html = `<b>${node.label}</b><br>`;
  html += `<span class="prop-key">type:</span> ${node.group}<br>`;
  if (node.qid) html += `<span class="prop-key">QID:</span> ${node.qid}<br>`;
  html += `<span class="prop-key">relations:</span> ${node.relCount}<br>`;

  // Show connected entities
  const connected = [];
  allEdges.forEach(e => {
    if (e.from === nodeId || e.to === nodeId) {
      const otherId = e.from === nodeId ? e.to : e.from;
      const other = GRAPH_DATA.nodes.find(n => n.id === otherId);
      if (other) {
        const dir = e.from === nodeId ? '→' : '←';
        connected.push({ name: other.label, pred: e.predicate || e._predicate, dir, id: otherId });
      }
    }
  });

  // Group by predicate
  const byPred = {};
  connected.forEach(c => {
    if (!byPred[c.pred]) byPred[c.pred] = [];
    byPred[c.pred].push(c);
  });

  for (const [pred, items] of Object.entries(byPred)) {
    html += `<br><span class="prop-key">${pred}:</span><br>`;
    items.slice(0, 10).forEach(item => {
      html += `&nbsp;&nbsp;${item.dir} <a href="#" onclick="focusOnNode('${item.id.replace(/'/g, "\'")}'); return false;" style="color:#8888cc">${item.name}</a><br>`;
    });
    if (items.length > 10) html += `&nbsp;&nbsp;<i>...and ${items.length - 10} more</i><br>`;
  }

  panel.innerHTML = html;
}

// ─── Network events ───
network.on('click', params => {
  if (params.nodes.length > 0) {
    focusOnNode(params.nodes[0]);
  }
});

network.on('doubleClick', params => {
  if (params.nodes.length > 0) {
    // Double click to expand neighborhood
    focusOnNode(params.nodes[0]);
  }
});

// ─── Controls ───
function resetView() {
  focusedNode = null;
  const nodeUpdates = [];
  allNodes.forEach(n => {
    nodeUpdates.push({
      id: n.id,
      color: n._origColor,
      size: n._origSize,
      font: { color: '#ccc', size: 11 },
      hidden: !activeTypes.has(n._group),
    });
  });
  allNodes.update(nodeUpdates);

  const edgeUpdates = [];
  allEdges.forEach(e => {
    edgeUpdates.push({
      id: e.id,
      color: e._origColor,
      width: e._predicate === 'appears_with' ? 0.5 : 1.5,
      font: { size: 0, color: '#666' },
      hidden: !activePreds.has(e._predicate),
    });
  });
  allEdges.update(edgeUpdates);

  document.getElementById('info-panel').style.display = 'none';
  network.fit({ animation: { duration: 500 } });
  updateStats();
}

function togglePhysics() {
  physicsOn = !physicsOn;
  network.setOptions({ physics: { enabled: physicsOn } });
}

document.getElementById('hops-select').addEventListener('change', () => {
  if (focusedNode) focusOnNode(focusedNode);
});

function updateStats() {
  let visNodes = 0, visEdges = 0;
  allNodes.forEach(n => { if (!n.hidden) visNodes++; });
  allEdges.forEach(e => { if (!e.hidden) visEdges++; });
  document.getElementById('stats').innerHTML =
    `Showing ${visNodes} nodes, ${visEdges} edges<br>` +
    `Total: ${GRAPH_DATA.stats.total_nodes} nodes, ${GRAPH_DATA.stats.total_edges} edges`;
}

// ─── Init ───
buildFilters();
updateStats();
</script>
